<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>DSA Dojo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one phone-width column; sticky tab bar; a card opens as a full panel over the list. */
:root {
  --paper: #f4f6f3; --panel: #ffffff; --ink: #18212b; --muted: #5b6673; --line: #dce1e2; --code: #edf1f3;
  --accent: #2c56c9; --accent-ink: #ffffff; --accent-soft: #e3eafb;
  --decaying: #c2410c; --weak: #a16207; --gap: #7c3aed; --good: #0f766e; --strong: #15803d; --meta: #475569;
  --pass: #15803d; --partial: #a16207; --fail: #c2410c;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0e1217; --panel: #151a21; --ink: #e5e9ee; --muted: #97a1ae; --line: #262e38; --code: #11161c;
  --accent: #7ea2ff; --accent-ink: #0b1220; --accent-soft: #1b2540;
  --decaying: #fb923c; --weak: #fbbf24; --gap: #a78bfa; --good: #2dd4bf; --strong: #4ade80; --meta: #94a3b8;
  --pass: #4ade80; --partial: #fbbf24; --fail: #fb923c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0e1217; --panel: #151a21; --ink: #e5e9ee; --muted: #97a1ae; --line: #262e38; --code: #11161c;
  --accent: #7ea2ff; --accent-ink: #0b1220; --accent-soft: #1b2540;
  --decaying: #fb923c; --weak: #fbbf24; --gap: #a78bfa; --good: #2dd4bf; --strong: #4ade80; --meta: #94a3b8;
  --pass: #4ade80; --partial: #fbbf24; --fail: #fb923c; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 12px 4px; }
.brand h1 { font: 800 22px/1.1 var(--f-display); margin: 0; letter-spacing: -0.01em; }
.brand .sub { color: var(--muted); font-size: 12px; text-align: right; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-block: 4px 0; }
nav.tabs::-webkit-scrollbar { display: none; }
@media (max-width: 430px) { nav.tabs button { padding: 8px 5px; font-size: 13px; } }
nav.tabs button { flex: 0 0 auto; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font: 600 14px var(--f-body); padding: 8px 7px; cursor: pointer; }
header.top .wrap { padding-block: 0; }
nav.tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
h2 { font: 800 19px/1.2 var(--f-display); margin: 22px 0 10px; text-wrap: balance; }
h3 { font: 600 15px/1.3 var(--f-display); margin: 18px 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 8px 12px; font: 600 14px var(--f-body); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: none; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, nav.tabs button:focus-visible, .item:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip { display: inline-block; font: 600 11px/1 var(--f-body); letter-spacing: .04em; text-transform: uppercase; padding: 4px 7px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.s-decaying { color: var(--decaying); } .s-weak { color: var(--weak); } .s-gap { color: var(--gap); }
.s-good { color: var(--good); } .s-strong { color: var(--strong); } .s-meta { color: var(--meta); }
.v-pass { color: var(--pass); } .v-partial { color: var(--partial); } .v-fail { color: var(--fail); }
/* progress strip */
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin-top: 14px; }
.strip > div { background: var(--panel); padding: 10px 12px; min-width: 0; }
.strip b { display: block; font: 800 20px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.strip span { color: var(--muted); font-size: 12px; }
@media (max-width: 460px) { .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.phase { margin-top: 10px; padding: 10px 12px; border-radius: var(--r); background: var(--accent-soft); font-size: 14px; }
/* lists */
.list { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); overflow: hidden; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; text-align: left; font: inherit; cursor: pointer; width: 100%; }
.item:first-child { border-top: 0; }
.item .t { font-weight: 600; min-width: 0; }
.item .d { grid-column: 1 / -1; color: var(--muted); font-size: 13px; min-width: 0; }
.kind { font: 600 11px/1 var(--f-body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; min-width: 80px; }
.bar > i { display: block; height: 100%; background: var(--strong); }
details.fold { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); margin-top: 10px; }
details.fold > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
details.fold > summary::after { content: "+"; color: var(--muted); }
details.fold[open] > summary::after { content: "–"; }
details.fold > .in { padding: 0 14px 14px; }
/* card panel */
.panel { position: fixed; inset: 0; z-index: 20; background: var(--paper); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); }
.panel-head { position: sticky; top: 0; z-index: 2; background: var(--paper); border-bottom: 1px solid var(--line); }
.panel-head .wrap { display: flex; gap: 10px; align-items: center; padding-block: 10px; }
.panel-head h2 { margin: 0; font-size: 18px; flex: 1; min-width: 0; }
.hook { font: 600 17px/1.45 var(--f-display); margin: 14px 0 6px; }
.box { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); padding: 12px 14px; margin-top: 10px; min-width: 0; }
.box h4 { margin: 0 0 6px; font: 600 12px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.box ul, .box ol { margin: 0; padding-left: 20px; }
.box li + li { margin-top: 4px; }
pre.code { margin: 0; background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font: 12.5px/1.5 var(--f-mono); white-space: pre; }
pre.code .cm { color: var(--muted); }
pre.ascii { margin: 0; font: 12.5px/1.45 var(--f-mono); white-space: pre; overflow-x: auto; background: var(--code); border-radius: 8px; padding: 10px 12px; border: 1px solid var(--line); }
code { font: 12.5px var(--f-mono); background: var(--code); padding: 1px 4px; border-radius: 4px; }
.hindi { font-style: italic; color: var(--muted); }
.ladder { display: grid; gap: 8px; }
.rung { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--panel); border-radius: 0 8px 8px 0; border-top: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.rung .lvl { font: 600 11px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.trap { border-left: 3px solid var(--fail); padding: 8px 12px; background: var(--panel); border-radius: 0 8px 8px 0; margin-top: 8px; border-top: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.trap code { white-space: normal; word-break: break-word; }
.stepper .ctl { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.stepper .note { margin-top: 6px; font-size: 14px; }
/* quiz */
.q { font: 500 16px/1.5 var(--f-body); margin: 6px 0 12px; }
textarea, input[type=text], input[type=number], select { width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 15px/1.5 var(--f-body); }
textarea { min-height: 130px; resize: vertical; }
textarea.codey { font: 13px/1.5 var(--f-mono); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); color: var(--muted); padding: 7px 10px; font: 600 13px var(--f-body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); }
.fb { margin-top: 12px; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); }
.fb .verdict { font: 800 15px var(--f-display); text-transform: uppercase; letter-spacing: .04em; }
.timer { font: 800 44px/1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; margin: 10px 0; }
.splits { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.splits .btn { justify-content: center; flex-direction: column; gap: 2px; padding: 10px 6px; }
.splits .btn small { font-weight: 400; color: inherit; opacity: .8; font-variant-numeric: tabular-nums; }
.days { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; align-items: end; height: 70px; margin-top: 8px; }
.days i { display: block; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }
.days-x { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; font-size: 10px; color: var(--muted); text-align: center; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t td, table.t th { text-align: left; padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top; }
table.t th { font: 600 11px var(--f-body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-top: 0; }
.scroll { overflow-x: auto; }
.banner { margin-top: 12px; padding: 10px 12px; border-radius: var(--r); border: 1px dashed var(--line); color: var(--muted); font-size: 13px; }
.opts { display: grid; gap: 8px; }
.opts .btn { justify-content: flex-start; text-align: left; }
.opts .btn.right { border-color: var(--pass); color: var(--pass); }
.opts .btn.wrong { border-color: var(--fail); color: var(--fail); }
.opts .btn:disabled { opacity: 1; }
.opts .btn:disabled:not(.right):not(.wrong) { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .item, .btn { transition: background .15s, border-color .15s; } }
.item:hover { background: var(--accent-soft); }
</style>

<header class="top"><div class="wrap">
  <div class="brand"><h1>DSA Dojo</h1><div class="sub" id="sub">Coding interview prep</div></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div></header>
<main class="wrap" id="main"><p class="muted" style="margin-top:24px">Loading the cards…</p></main>
<div class="panel" id="panel" hidden></div>

<script>
// ---------- constants ----------
const TABS = [['home','Home'],['router','Router'],['cards','Cards'],['quiz','Quiz'],['timer','Timer'],['progress','Progress'],['about','About']];
const STATUS_ORDER = { meta: 0, decaying: 1, weak: 2, gap: 3, good: 4, strong: 5 };
const STATUS_LABEL = { meta: 'method', decaying: 'decaying', weak: 'weak', gap: 'gap', good: 'good', strong: 'strong' };
const BOX_DAYS = [0, 1, 3, 7, 21, 45];   // box n -> next review after BOX_DAYS[n] days
const MASTER_BOX = 3;                    // passed at a 7-day review

function addDays(s, n) { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function problemId(name) { const s = String(name || '').trim(); return 'p:' + (s.match(/^\d+/)?.[0] || s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')); }
const attemptDay = (a) => a.day || String(a.at || '').slice(0, 10);
function attemptId(a) { return a.id || ['x', a.at, a.kind, a.card || '', a.q || '', a.problem || ''].join('|').replace(/[^A-Za-z0-9_\-.~:@+]/g, '_').slice(0, 200); }

function fold(attempts) {
  const R = {};
  const list = [...attempts].sort((x, y) => String(x.at).localeCompare(String(y.at)));
  for (const a of list) {
    let id, verdict, kind, title = '';
    if (a.kind === 'quiz' && a.verdict) { id = `${a.card}:${a.q}`; verdict = a.verdict; kind = 'quiz'; }
    else if (a.kind === 'timer' && a.problem) {
      id = problemId(a.problem); kind = 'problem'; title = a.problem;
      verdict = a.result === 'clean' ? 'pass' : 'fail';
      if (verdict === 'pass' && !R[id]) continue;          // a clean first solve needs no re-solve
    } else continue;
    const day = attemptDay(a);
    const old = R[id] || { id, kind, card: a.card || '', q: kind === 'quiz' ? a.q : id, title, box: 0, history: [] };
    let box = old.box;
    if (verdict === 'pass') box = Math.min(box + 1, BOX_DAYS.length - 1);
    else if (verdict === 'partial') box = Math.max(1, box);
    else box = 1;
    const days = verdict === 'pass' ? BOX_DAYS[box] : kind === 'problem' ? 3 : 1;
    R[id] = { ...old, card: a.card || old.card, title: title || old.title, box, due: addDays(day, days), last: day,
      history: [...old.history, { day, v: verdict }].slice(-12) };
  }
  return R;
}

function union(...lists) {
  const m = new Map();
  for (const l of lists) for (const a of l || []) { if (!a || !a.at) continue; const id = attemptId(a); if (!m.has(id)) m.set(id, { ...a, id }); }
  return [...m.values()].sort((x, y) => String(x.at).localeCompare(String(y.at)));
}
const TYPE_LABEL = { recognize: 'think aloud', trap: 'your old bug', followup: 'follow-up', recall: 'write it', predict: 'trace it' };

// ---------- state ----------
const S = { cards: [], byId: {}, router: null, version: '', reviews: {}, attempts: [], plan: null,
  tab: 'home', store: null, pending: [], public: false, sample: null, quiz: null, drill: null, chat: {}, filter: 'all' };

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => ymd(new Date());
function ymd(d) { const z = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; }
function weekStart() { const d = new Date(); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return ymd(d); }
function fmtSecs(s) { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60), r = s % 60; return `${m}:${String(r).padStart(2, '0')}`; }
function codeHtml(src) { return esc(src).split('\n').map((l) => l.replace(/(\/\/.*)$/, '<span class="cm">$1</span>')).join('\n'); }
function chip(status) { return `<span class="chip s-${status}">${STATUS_LABEL[status] || status}</span>`; }
const lsGet = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

// ---------- progress model ----------
const itemId = (cardId, qid) => `${cardId}:${qid}`;
function cardStats(c) {
  let seen = 0, mastered = 0, due = 0; const t = today();
  for (const q of c.quiz) { const r = S.reviews[itemId(c.id, q.id)];
    if (!r) continue; seen++; if (r.box >= MASTER_BOX) mastered++; if (r.due <= t) due++; }
  const n = c.quiz.length;
  return { n, seen, mastered, due, state: mastered === n ? 'done' : seen ? 'active' : 'new' };
}
function dueItems() {
  const t = today(), out = [];
  for (const r of Object.values(S.reviews)) if (r.due <= t) out.push(r);
  return out.sort((a, b) => a.due.localeCompare(b.due) || a.box - b.box);
}
function minutesByDay() {
  const m = {};
  for (const a of S.attempts) { const d = attemptDay(a); m[d] = (m[d] || 0) + (a.secs || 0) / 60; }
  return m;
}
function dailyTarget() {
  if (S.plan?.daily_target_min) return S.plan.daily_target_min;
  const t = today(); return (t >= '2026-11-05' && t <= '2026-11-23') ? 15 : 45;
}
function streak() {
  const m = minutesByDay(); let d = today(), n = 0;
  if (!m[d]) d = addDays(d, -1);
  while (m[d]) { n++; d = addDays(d, -1); }
  return n;
}

// ---------- storage: one attempt log, three backends ----------
// Progress = append-only attempts with unique ids. claude.ai keeps them in its db, github.io in a private GitHub repo,
// this browser keeps unsent ones. Review state is folded from the log, so every surface shows the same thing after a sync.
const GH_KEY = 'dojo-github', LOCAL_KEY = 'dojo-local-attempts';
const newId = () => Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
function recompute() { S.reviews = fold(S.attempts); }
function setAttempts(list) { S.attempts = union(list, S.pending); recompute(); }
async function logAttempt(a) {
  const rec = { ...a, id: newId(), at: new Date().toISOString(), day: today(), src: S.store?.name || 'local' };
  S.pending.push(rec); lsSet(LOCAL_KEY, S.pending);
  S.attempts = union(S.attempts, [rec]); recompute();
  if (!S.store?.persistent) return;
  try { await S.store.write(rec); S.pending = S.pending.filter((x) => x.id !== rec.id); lsSet(LOCAL_KEY, S.pending); }
  catch (e) { note('Saved on this device only for now; it uploads on the next load (' + (e.code || e.message) + ').'); }
}
function dbStore(db, uid) {
  const col = db.collection(`data/users/${uid}/dojo/attempts`);
  return { name: 'claude', persistent: true,
    start() {
      col.onSnapshot((s) => { setAttempts(s.docs.map((d) => ({ ...d.data(), id: d.id }))); refresh(); }, () => {});
      db.doc('meta/plan').onSnapshot((s) => { S.plan = s.exists ? s.data() : null; refresh(); }, () => {});
    },
    write: (a) => col.doc(a.id).set(a) };
}
const b64 = (str) => btoa(unescape(encodeURIComponent(str)));
function ghStore(cfg) {
  const api = (path, opt = {}) => fetch(`https://api.github.com/repos/${cfg.repo}/contents/${path}`, { ...opt,
    headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github.raw+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opt.headers || {}) } });
  const store = { name: 'github', persistent: true,
    async start() { await store.pull(); },
    async pull() {
      const out = [];
      let r = await api('state.json?t=' + Date.now());
      if (r.status === 401 || r.status === 403) throw new Error(`GitHub refused the token (${r.status})`);
      if (r.ok) { const st = await r.json(); out.push(...(st.attempts || [])); if (st.plan) S.plan = st.plan; S.ghSynced = st.updated || ''; }
      r = await api('inbox?t=' + Date.now(), { headers: { Accept: 'application/vnd.github+json' } });
      if (r.ok) {
        const files = (await r.json()).filter((f) => f.name.endsWith('.json'));
        const docs = await Promise.all(files.map((f) => api('inbox/' + f.name).then((x) => (x.ok ? x.json() : null)).catch(() => null)));
        out.push(...docs.filter(Boolean));
      }
      setAttempts(out); S.ghPulled = new Date().toLocaleTimeString(); refresh();
    },
    async write(a) {
      const r = await api('inbox/' + a.id + '.json', { method: 'PUT', headers: { Accept: 'application/vnd.github+json' },
        body: JSON.stringify({ message: `dojo: ${a.kind} ${a.card || ''}`.trim(), content: b64(JSON.stringify(a)) }) });
      if (!r.ok) throw new Error('GitHub ' + r.status);
    } };
  return store;
}
const localStore = () => ({ name: 'local', persistent: false, start() { setAttempts([]); }, write() {} });
function note(msg) { const b = $('#note'); if (b) { b.textContent = msg; b.hidden = false; } }

// ---------- router (tabs + card panel via hash) ----------
function go(tab) { S.tab = tab; history.replaceState(null, '', '#' + tab); lsSet('dojo-tab', tab); render(); window.scrollTo(0, 0); }
function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${l}${k === 'quiz' && dueItems().length ? ` <span class="muted">${dueItems().length}</span>` : ''}</button>`).join('');
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab]'); if (t) { go(t.dataset.tab); return; }
  const a = e.target.closest('[data-act]'); if (a) { ACT[a.dataset.act]?.(a.dataset, a, e); return; }
  const c = e.target.closest('[data-card]'); if (c) { openCard(c.dataset.card); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#panel').hidden) closeCard(); });

// ---------- views ----------
function render() {
  renderTabs();
  const v = VIEWS[S.tab] || VIEWS.home;
  $('#main').innerHTML = `<div id="note" class="banner" hidden></div>` + v();
  if (!S.store) note('Connecting to your progress…');
  else if (S.store.name === 'local' && S.tab !== 'about') note(S.pending.length ? `${S.pending.length} attempt(s) saved in this browser only. Connect GitHub in About to sync them.` : 'Progress saves in this browser only. To sync with your other devices, connect GitHub in the About tab.');
  AFTER[S.tab]?.();
}
const AFTER = {};

const VIEWS = {
  home() {
    const total = S.cards.length, st = S.cards.map((c) => ({ c, s: cardStats(c) }));
    const done = st.filter((x) => x.s.state === 'done').length;
    const mins = minutesByDay(), ws = weekStart(); let week = 0;
    for (const [d, m] of Object.entries(mins)) if (d >= ws) week += m;
    const target = dailyTarget() * 7;
    const due = dueItems();
    const next = [];
    // 1. due quiz reviews grouped by card
    const dueByCard = {};
    for (const r of due.filter((r) => r.kind === 'quiz')) (dueByCard[r.card] ||= []).push(r);
    for (const [cid, rs] of Object.entries(dueByCard)) { const c = S.byId[cid]; if (!c) continue;
      next.push(`<button class="item" data-act="quizCard" data-id="${cid}" data-due="1"><span class="t"><span class="kind">Review</span>${esc(c.title)}</span>${chip(c.status)}<span class="d">${rs.length} question${rs.length > 1 ? 's' : ''} due · spaced review keeps it from decaying</span></button>`); }
    // 2. due problem re-solves
    for (const r of due.filter((r) => r.kind === 'problem'))
      next.push(`<button class="item" data-act="timerFor" data-problem="${esc(r.title)}" data-cid="${esc(r.card)}" data-mode="cold"><span class="t"><span class="kind">Re-solve</span>${esc(r.title)}</span><span class="chip s-weak">cold</span><span class="d">Timed, no notes. Box ${r.box} · last ${esc(r.last || '')}</span></button>`);
    // 3. this week's focus cards from the plan
    const focus = (S.plan?.week_focus || []).filter((id) => S.byId[id] && cardStats(S.byId[id]).state !== 'done');
    for (const id of focus) { const c = S.byId[id], s = cardStats(c);
      next.push(`<button class="item" data-card="${id}"><span class="t"><span class="kind">${s.state === 'new' ? 'Learn' : 'Continue'}</span>${esc(c.title)}</span>${chip(c.status)}<span class="d">This week's focus · ${s.seen}/${s.n} questions tried</span></button>`); }
    // 4. timed problems the plan suggests
    for (const p of (S.plan?.next_problems || []).slice(0, 3))
      next.push(`<button class="item" data-act="timerFor" data-problem="${esc(p.name)}" data-cid="${esc(p.card || '')}" data-mode="${esc(p.mode || 'unseen')}"><span class="t"><span class="kind">Timed</span>${esc(p.name)}</span><span class="chip s-meta">${esc(p.mode || 'unseen')}</span><span class="d">${esc(p.why || 'From the plan')}</span></button>`);
    // 5. next new cards by priority
    const fresh = st.filter((x) => x.s.state === 'new' && !focus.includes(x.c.id)).sort((a, b) => STATUS_ORDER[a.c.status] - STATUS_ORDER[b.c.status]).slice(0, focus.length ? 2 : 4);
    for (const { c } of fresh) next.push(`<button class="item" data-card="${c.id}"><span class="t"><span class="kind">New</span>${esc(c.title)}</span>${chip(c.status)}<span class="d">${esc(c.evidence || c.hook).slice(0, 140)}</span></button>`);
    const active = st.filter((x) => x.s.state === 'active' && !focus.includes(x.c.id) && !dueByCard[x.c.id]);
    const doneList = st.filter((x) => x.s.state === 'done');
    return `
      <div class="strip">
        <div><b>${done}/${total}</b><span>patterns mastered</span></div>
        <div><b>${due.length}</b><span>reviews due</span></div>
        <div><b>${Math.round(week)}<span class="muted" style="font-size:13px"> / ${target}</span></b><span>minutes this week</span></div>
        <div><b>${streak()}</b><span>day streak</span></div>
      </div>
      ${S.plan ? `<div class="phase"><b>${esc(S.plan.phase || '')}</b>${S.plan.note ? ` · ${esc(S.plan.note)}` : ''}</div>` : `<div class="phase">Plan not synced yet. Start with the first cards below; Claude writes the weekly focus at the next sync.</div>`}
      <h2>Do next</h2>
      <div class="list">${next.join('') || `<div class="item"><span class="t">Nothing due.</span><span class="d">Open the Router drill or start a timed problem.</span></div>`}</div>
      ${active.length ? `<h2>In progress</h2><div class="list">${active.map(({ c, s }) => `<button class="item" data-card="${c.id}"><span class="t">${esc(c.title)}</span>${chip(c.status)}<span class="d"><span class="bar" style="display:inline-block;width:120px;vertical-align:middle"><i style="width:${Math.round(100 * s.mastered / s.n)}%"></i></span> ${s.mastered}/${s.n} mastered</span></button>`).join('')}</div>` : ''}
      <details class="fold" ${doneList.length ? '' : ''}><summary>Done · ${doneList.length} pattern${doneList.length === 1 ? '' : 's'}</summary><div class="in">${doneList.length ? `<div class="list">${doneList.map(({ c }) => `<button class="item" data-card="${c.id}"><span class="t">${esc(c.title)}</span>${chip(c.status)}</button>`).join('')}</div>` : '<p class="muted small">A pattern moves here when every question on it has passed a 7-day review.</p>'}</div></details>
      <details class="fold"><summary>How the Dojo works</summary><div class="in small">
        <ol>
          <li><b>Learn</b> a card: hook → invariant → template → step-through → traps from your own history → how it is asked → follow-ups L1 → L3.</li>
          <li><b>Quiz</b>: answer by voice on the phone (think aloud) or in C++ on the laptop. Claude points out the exact miss and one hint; you retry once before the reference answer opens.</li>
          <li><b>Spaced reviews</b> at 1, 3, 7, 21 and 45 days. A pattern is mastered when all its questions pass the 7-day review.</li>
          <li><b>Timer</b>: unseen and cold problems with three splits: approach said (T1), code done (T2), dry-run done (T3). Misses come back for a cold re-solve.</li>
          <li><b>Sync</b>: progress saves where you are (claude.ai or GitHub). "dojo sync" in Claude merges every device; details in About.</li>
        </ol></div></details>
      <p class="small muted" style="margin-top:18px">Cards ${esc(S.version)} · ${total} patterns · ${S.cards.reduce((n, c) => n + c.quiz.length, 0)} questions</p>`;
  },

  router() {
    const r = S.router;
    return `
      <h2>Map a problem to a pattern in 5 minutes</h2>
      <p class="muted small">Constraints pick the complexity. The complexity shortlists the patterns. The signal words pick one.</p>
      <div class="box"><h4>Drill: name the pattern</h4><div id="drill"></div></div>
      <h3>Constraint → complexity</h3>
      <div class="box scroll"><table class="t"><tr><th>Input size</th><th>Target</th><th>Typical patterns</th></tr>
        ${r.complexity.map(([a, b, c]) => `<tr><td>${esc(a)}</td><td><code>${esc(b)}</code></td><td>${esc(c)}</td></tr>`).join('')}</table></div>
      <h3>Signal → pattern</h3>
      <div class="list">${r.signals.map(([sig, id]) => { const c = S.byId[id]; return `<button class="item" data-card="${id}"><span class="t" style="font-weight:500">${esc(sig)}</span>${chip(c.status)}<span class="d">→ ${esc(c.title)}</span></button>`; }).join('')}</div>`;
  },

  cards() {
    const st = S.cards.map((c) => ({ c, s: cardStats(c) }));
    const order = (a, b) => (a.s.state === 'done') - (b.s.state === 'done') || (b.s.due > 0) - (a.s.due > 0) || STATUS_ORDER[a.c.status] - STATUS_ORDER[b.c.status];
    const f = S.filter;
    const shown = st.filter((x) => f === 'all' || x.c.status === f || (f === 'done' && x.s.state === 'done')).sort(order);
    const filters = ['all', 'decaying', 'weak', 'gap', 'good', 'strong', 'meta', 'done'];
    return `
      <h2>Pattern cards</h2>
      <div class="row" style="margin-bottom:10px">${filters.map((k) => `<button class="btn ${f === k ? 'primary' : 'ghost'}" data-act="filter" data-f="${k}" style="padding:5px 10px;font-size:13px">${k === 'meta' ? 'method' : k}</button>`).join('')}</div>
      <div class="list">${shown.map(({ c, s }) => `<button class="item" data-card="${c.id}">
        <span class="t">${esc(c.title)} <span class="muted small" style="font-weight:400">· ${esc(c.group)}</span></span>${chip(c.status)}
        <span class="d">${s.state === 'done' ? 'Mastered' : s.due ? `${s.due} due · ` : ''}${s.state !== 'done' ? `${s.mastered}/${s.n} mastered` : ''}${c.trace ? ' · has step-through' : ''}</span></button>`).join('')}</div>`;
  },

  quiz() {
    if (S.quiz) return quizView();
    const due = dueItems().filter((r) => r.kind === 'quiz');
    const weakest = S.cards.filter((c) => c.status !== 'strong').length;
    return `
      <h2>Quiz</h2>
      <p class="muted small">Answer by voice on the phone: tap the mic on your keyboard and think aloud. Claude grades the approach, invariant, complexity and edge cases, not the syntax.</p>
      <div class="stack" style="margin-top:12px">
        <button class="btn primary" data-act="quizDue" ${due.length ? '' : 'disabled'}>Due reviews (${due.length})</button>
        <button class="btn" data-act="quizNew">New questions from the next card (${esc(nextNewCard()?.title || 'none left')})</button>
        <button class="btn" data-act="quizMixed">Mixed set: 6 questions from weak, decaying and gap patterns (${weakest} cards)</button>
        <button class="btn ghost" data-tab="cards">Pick a card…</button>
      </div>`;
  },

  timer() {
    const t = S.timer || lsGet('dojo-timer') || {};
    S.timer = t;
    const cardOpts = S.cards.map((c) => `<option value="${c.id}" ${t.card === c.id ? 'selected' : ''}>${esc(c.title)}</option>`).join('');
    const running = !!t.t0 && !t.end;
    const sp = t.splits || {};
    const recent = S.attempts.filter((a) => a.kind === 'timer').slice(-8).reverse();
    return `
      <h2>Timed problem</h2>
      <p class="muted small">The bar for a Medium: approach said in 5 min (T1), code done by 17 (T2), dry-run done by 20 (T3). Say the approach out loud before you type.</p>
      <div class="stack" style="margin-top:10px">
        <input type="text" id="t-problem" placeholder="Problem, e.g. 269 Alien Dictionary" value="${esc(t.problem || '')}" ${running ? 'disabled' : ''}>
        <div class="row" style="flex-wrap:nowrap">
          <select id="t-card" ${running ? 'disabled' : ''}><option value="">Pattern (optional)</option>${cardOpts}</select>
          <select id="t-mode" ${running ? 'disabled' : ''} style="max-width:150px">${['unseen', 'cold', 'new', 'mock'].map((m) => `<option ${t.mode === m ? 'selected' : ''}>${m}</option>`).join('')}</select>
        </div>
      </div>
      <div class="timer" id="t-clock">${fmtSecs(running ? (Date.now() - t.t0) / 1000 : t.end ? (t.end - t.t0) / 1000 : 0)}</div>
      ${!t.t0 ? `<button class="btn primary" data-act="tStart">Start the clock</button>` : `
      <div class="splits">
        ${[['t1', 'Approach said'], ['t2', 'Code done'], ['t3', 'Dry-run done']].map(([k, l]) => `<button class="btn ${sp[k] ? '' : 'primary'}" data-act="tSplit" data-k="${k}" ${sp[k] || !running ? 'disabled' : ''}>${l}<small>${sp[k] ? fmtSecs(sp[k]) : '—'}</small></button>`).join('')}
      </div>
      ${running ? `<div class="row" style="margin-top:10px"><button class="btn" data-act="tStop">Stop</button><button class="btn ghost" data-act="tReset">Discard</button></div>` : `
      <div class="box"><h4>How did it go?</h4><div class="stack">
        <select id="t-result">${[['clean', 'Clean: passed, no hints'], ['bugs', 'Passed after fixing my own bugs'], ['hint', 'Needed a hint'], ['failed', 'Did not finish'], ['peeked', 'Looked at a solution']].map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>
        <input type="number" id="t-resub" min="0" placeholder="Resubmits within 3 minutes of a failure (0 if none)">
        <textarea id="t-bugs" placeholder="Bugs or misses, e.g. forgot the prefix rule; int overflow in mid" style="min-height:80px"></textarea>
        <div class="row"><button class="btn primary" data-act="tSave">Save attempt</button><button class="btn ghost" data-act="tReset">Discard</button></div>
      </div></div>`}`}
      ${recent.length ? `<h3>Recent</h3><div class="box scroll"><table class="t"><tr><th>When</th><th>Problem</th><th>T1/T2/T3</th><th>Result</th></tr>${recent.map((a) => `<tr><td>${esc(a.at.slice(5, 10))}</td><td>${esc(a.problem)}</td><td>${[a.t1, a.t2, a.t3].map((x) => x ? fmtSecs(x) : '—').join(' / ')}</td><td>${esc(a.result)}</td></tr>`).join('')}</table></div>` : ''}`;
  },

  progress() {
    const mins = minutesByDay(); const days = [];
    for (let i = 13; i >= 0; i--) { const d = addDays(today(), -i); days.push([d, mins[d] || 0]); }
    const max = Math.max(dailyTarget(), ...days.map((x) => x[1]));
    const timed = S.attempts.filter((a) => a.kind === 'timer');
    const last10 = timed.slice(-10);
    const avg = (k) => { const v = last10.map((a) => a[k]).filter(Boolean); return v.length ? fmtSecs(v.reduce((a, b) => a + b, 0) / v.length) : '—'; };
    const cold = timed.filter((a) => a.mode === 'cold'); const coldPass = cold.length ? Math.round(100 * cold.filter((a) => a.result === 'clean').length / cold.length) + '%' : '—';
    const quiz = S.attempts.filter((a) => a.kind === 'quiz'); const qPass = quiz.length ? Math.round(100 * quiz.filter((a) => a.verdict === 'pass').length / quiz.length) + '%' : '—';
    const resub = timed.filter((a) => a.resub != null); const resubAvg = resub.length ? (resub.reduce((s, a) => s + (+a.resub || 0), 0) / resub.length).toFixed(1) : '—';
    const groups = {};
    for (const c of S.cards) (groups[c.group] ||= []).push(c);
    const phases = S.plan?.phases || [];
    return `
      <h2>Progress</h2>
      <div class="strip">
        <div><b>${timed.length}</b><span>timed problems</span></div>
        <div><b>${avg('t1')}</b><span>avg T1 (approach), last 10</span></div>
        <div><b>${coldPass}</b><span>cold re-solves clean</span></div>
        <div><b>${qPass}</b><span>quiz first-try pass</span></div>
      </div>
      <div class="strip" style="margin-top:8px">
        <div><b>${avg('t2')}</b><span>avg T2 (code done)</span></div>
        <div><b>${avg('t3')}</b><span>avg T3 (dry-run done)</span></div>
        <div><b>${resubAvg}</b><span>fast resubmits per problem</span></div>
        <div><b>${Object.keys(S.reviews).length}</b><span>questions in rotation</span></div>
      </div>
      <h3>Minutes per day, last 14 days <span class="muted small">(target ${dailyTarget()})</span></h3>
      <div class="days">${days.map(([d, m]) => `<i title="${d}: ${Math.round(m)} min" style="height:${Math.max(2, Math.round(70 * m / max))}px;${m >= dailyTarget() ? '' : 'opacity:.55'}"></i>`).join('')}</div>
      <div class="days-x">${days.map(([d]) => `<span>${d.slice(8)}</span>`).join('')}</div>
      ${phases.length ? `<h3>Plan</h3><div class="box scroll"><table class="t"><tr><th>Phase</th><th>Dates</th><th>Focus</th></tr>${phases.map((p) => `<tr><td>${esc(p.name)}${p.current ? ' ◂' : ''}</td><td>${esc(p.dates)}</td><td>${esc(p.focus)}</td></tr>`).join('')}</table></div>` : ''}
      <h3>Mastery by pattern</h3>
      ${Object.entries(groups).map(([g, cs]) => `<div class="box"><h4>${esc(g)}</h4><div class="stack">${cs.map((c) => { const s = cardStats(c); return `<button class="item" data-card="${c.id}" style="padding:6px 0;border:0"><span class="t" style="font-weight:500">${esc(c.title)}</span><span class="bar" style="width:110px"><i style="width:${Math.round(100 * s.mastered / s.n)}%"></i></span></button>`; }).join('')}</div></div>`).join('')}`;
  },

  about() {
    const st = S.store?.name || 'connecting';
    const gh = lsGet(GH_KEY) || {};
    const onClaude = st === 'claude';
    const where = { claude: 'claude.ai (saved to your private Dojo storage the moment you answer)', github: `GitHub repo ${esc(gh.repo)} (each answer is uploaded as you go${S.ghPulled ? `; last pulled ${esc(S.ghPulled)}` : ''})`, local: 'this browser only (not synced yet)', connecting: 'connecting…' }[st];
    const rows = [
      ['Home', 'Your start page. Progress strip (patterns mastered, reviews due, minutes this week vs target, streak), this phase of the plan, and <b>Do next</b>: due reviews first, then cold re-solves, this week\'s focus cards, timed problems from the plan, and new cards. Mastered patterns sink into <b>Done</b>.'],
      ['Router', 'Train the first 5 minutes: constraint → complexity table, signal → pattern table, and a drill that shows a problem and asks you to name the pattern. Use it in spare minutes on the phone.'],
      ['Cards', 'All 37 patterns, filtered by status (decaying, weak, gap, good, strong, method). Unfinished and due cards are listed first; mastered ones go to the bottom. A card holds: signals, invariant, the first 5 minutes, mechanism, C++ template, a step-through, your own past traps, how it is asked, the follow-up ladder L1 → L3 and practice problems.'],
      ['Quiz', 'Due reviews, new questions from the next card, or a mixed set. Answer by voice (keyboard mic) or in code. On claude.ai Claude grades you and you retry once; elsewhere you compare with the reference and mark yourself.'],
      ['Timer', 'For a real problem: press Start, then <b>Approach said</b> (T1), <b>Code done</b> (T2) and <b>Dry-run done</b> (T3). Save the result and bugs. A miss comes back as a cold re-solve in 3 days.'],
      ['Progress', 'Timed-problem averages (T1/T2/T3), cold re-solve rate, quiz pass rate, minutes per day for 14 days, the plan phases, and a mastery bar for every pattern.'],
      ['About', 'This page: how to use the Dojo, where your progress is saved, and syncing between devices.'],
    ];
    return `
      <h2>How to use the Dojo</h2>
      <p>The Dojo turns DSA prep into short daily reps: learn a pattern from its card, prove it in a quiz, keep it with spaced reviews, and measure speed on timed problems. Reading a card does not count as progress. Only answered questions and timed problems do, because recall is what decays.</p>
      <h3>What each tab shows</h3>
      <div class="box scroll"><table class="t">${rows.map(([a, b]) => `<tr><td style="white-space:nowrap"><b>${a}</b></td><td>${b}</td></tr>`).join('')}</table></div>
      <h3>A normal day</h3>
      <div class="box"><ol>
        <li><b>Home → Do next</b>, top item first. Reviews that are due always come first; they take 5–10 minutes.</li>
        <li><b>One card</b> from this week's focus: read the hook, invariant and template, play the step-through, then press <b>Practice this card</b>.</li>
        <li><b>One timed problem</b> on the Timer (laptop days). Say the approach out loud before pressing T1.</li>
        <li>Phone-only days (and Nov 5–23): 15 minutes of due reviews and the Router drill.</li>
      </ol></div>
      <h3>How progress is marked</h3>
      <div class="box"><ul>
        <li><b>Quiz:</b> each graded answer is saved: <span class="v-pass">pass</span> moves the question to a longer gap (1 → 3 → 7 → 21 → 45 days), <span class="v-partial">partial</span> repeats it tomorrow at the same level, <span class="v-fail">fail</span> starts it again tomorrow.</li>
        <li><b>Mastered</b> = every question on a card has passed its 7-day review. The card then moves to Done.</li>
        <li><b>Timer:</b> pressing <b>Save attempt</b> logs T1/T2/T3, result and bugs. Anything but a clean solve is scheduled as a cold re-solve.</li>
        <li><b>Router drill</b> and coach questions count toward minutes only.</li>
      </ul></div>
      <h3>Where your progress is saved</h3>
      <div class="box">
        <p style="margin:0 0 8px">This view saves to: <b>${where}</b>.</p>
        <table class="t">
          <tr><th>Where you open it</th><th>Saves to</th><th>Sees the others</th></tr>
          <tr><td>claude.ai: web, desktop app, phone app</td><td>claude.ai, instantly</td><td>after a sync</td></tr>
          <tr><td>github.io: office laptop, any browser</td><td>your private GitHub repo, instantly (once connected below)</td><td>after a sync</td></tr>
          <tr><td>Claude Code on either laptop</td><td>runs the sync</td><td>merges everything</td></tr>
        </table>
        <p class="small" style="margin:8px 0 0"><b>Sync</b> = say "dojo sync" in any Claude Code session (the 9 AM routine also runs it when it has access). It merges every attempt from claude.ai and GitHub, writes the merged history back to both, copies it into the career hub (DSA log, review queue, weekly numbers, morning digest) and updates this week's plan. Attempts are never overwritten, so nothing is lost if you practise on two devices on the same day.</p>
      </div>
      ${onClaude ? '' : `
      <h3>Connect GitHub (for github.io)</h3>
      <div class="box stack">
        ${S.storeError ? `<p class="v-fail" style="margin:0">Last connect failed: ${esc(S.storeError)}</p>` : ''}
        <p class="small" style="margin:0">Create a fine-grained token at <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>: Repository access → <b>Only select repositories</b> → <code>dsa-progress</code>; Permissions → <b>Contents: Read and write</b>; expiry 90 days. Paste it here. It is stored only in this browser and can only touch that one repo.</p>
        <input type="text" id="gh-repo" placeholder="owner/repo" value="${esc(gh.repo || 'apsy3677/dsa-progress')}">
        <input type="password" id="gh-token" placeholder="github_pat_…" value="${gh.token ? '••••••••' : ''}" autocomplete="off">
        <div class="row">
          <button class="btn primary" data-act="ghConnect">${gh.token ? 'Save and reconnect' : 'Connect'}</button>
          ${gh.token ? `<button class="btn" data-act="ghPull">Pull latest</button><button class="btn ghost" data-act="ghForget">Disconnect</button>` : ''}
        </div>
      </div>`}
      <h3>Backup or move by hand</h3>
      <div class="box stack">
        <p class="small" style="margin:0">If a device cannot connect, copy its attempts here and paste them on another device (or send them to Claude). Pasting only adds attempts that are not already there.</p>
        <div class="row"><button class="btn" data-act="exportCopy">Copy my attempts (${S.attempts.length})</button></div>
        <textarea id="imp" style="min-height:70px" placeholder="Paste exported attempts (JSON) here"></textarea>
        <div class="row"><button class="btn" data-act="importPaste">Add pasted attempts</button></div>
      </div>

                    <button class="btn ghost" data-act="qGiveUp" ${z.busy ? 'disabled' : ''}>Show the answer</button>` :
        z.revealed ? `<span class="muted small">How did you do?</span><button class="btn" data-act="qSelf" data-v="pass">Had it</button><button class="btn" data-act="qSelf" data-v="partial">Partly</button><button class="btn" data-act="qSelf" data-v="fail">Missed</button>` :
        `<button class="btn primary" data-act="qReveal">Show the answer</button>`}
    </div>

}
function gradePrompt(c, q, answers, fb, mode) {
  return `You are a strict but kind DSA interview coach for a C++ engineer with 11 years of experience preparing for Big Tech coding interviews.
Grade the candidate's answer to one question about the pattern "${c.title}".

Pattern invariant: ${c.invariant.join(' ')}
First-5-minutes summary: ${c.five_min}
Question type: ${q.type} (${TYPE_LABEL[q.type]})
Question: ${q.q}
Reference answer: ${q.key}

Answer mode: ${mode === 'voice' ? 'THINK ALOUD. The answer was dictated by voice: ignore grammar, filler words and speech-to-text errors (e.g. "matrices" for "metrics", "item potency" for "idempotency"). Grade only the reasoning: correct pattern, invariant, complexity, edge cases and the key step.' : 'CODE. Check correctness, edge cases (empty, one element, duplicates/ties, overflow) and C++ hygiene (long long where needed, const&, every memo return stored). Pseudocode is acceptable when the logic is complete.'}
${answers.length > 1 ? `This is the candidate's SECOND attempt. First attempt: """${answers[0]}"""\nFeedback they got: miss = ${fb[0]?.miss || ''}; hint = ${fb[0]?.hint || ''}\n` : ''}Candidate answer: """${answers[answers.length - 1]}"""

Rules: "pass" = the essential idea and the key detail from the reference are present (wording can differ; a different correct approach also passes). "partial" = right direction but the key detail, complexity or an edge case is missing or wrong. "fail" = wrong pattern or no real answer.
"miss": the single most important gap, concrete, max 2 sentences (empty string if pass).
"hint": one nudge that does NOT give the answer away (empty if pass).
"praise": one short sentence on what was right (empty if nothing).
"better": a model answer in at most 4 sentences, in English.
Reply with only JSON: {"verdict":"pass|partial|fail","miss":"","hint":"","praise":"","better":""}`;
}
async function qCheck() {
  const z = S.quiz; const ans = $('#ans').value.trim(); if (!ans) { $('#ans').focus(); return; }
  const it = z.items[z.i], c = S.byId[it.card], q = c.quiz.find((x) => x.id === it.q);
  z.answers[z.attempt] = ans; z.busy = true; render();
  try {
    const r = await S.sample.json(gradePrompt(c, q, z.answers.slice(0, z.attempt + 1), z.fb, z.mode), { modelTier: 'default' });
    const f = { verdict: ['pass', 'partial', 'fail'].includes(r?.verdict) ? r.verdict : 'partial', miss: r?.miss || '', hint: r?.hint || '', praise: r?.praise || '', better: r?.better || '' };
    z.fb.push(f); z.busy = false;
    if (f.verdict === 'pass' || z.attempt >= 1) await finishQ(z.attempt === 0 ? f.verdict : (f.verdict === 'pass' ? 'partial' : 'fail'));
    else { z.attempt = 1; render(); }
  } catch (e) {
    z.busy = false;
    if (e?.code === 'not_granted') { S.sample = null; note('Claude grading was declined for this page. You can grade yourself against the reference.'); }
    else if (e?.code === 'rate_limited') note('Too many checks at once. Wait a minute and try again.');
    else note('Claude could not grade this one (' + (e?.code || 'error') + '). Try again, or show the answer.');
    render();
  }
}
async function finishQ(verdict) {
  const z = S.quiz, it = z.items[z.i];
  z.done = true; z.verdict = verdict; z.results.push(verdict);
  const secs = Math.min(600, (Date.now() - z.t0) / 1000);
  await logAttempt({ kind: 'quiz', card: it.card, q: it.q, verdict, secs: Math.round(secs), mode: z.mode, tries: z.answers.length || 0 });
  render();
}

// ---------- coach chat ----------
function coachRules(c) {
  return `You are the learner's DSA tutor (C++ engineer, 11 years, preparing for Big Tech coding rounds). Topic: the pattern "${c.title}".
Card context: hook: ${c.hook} | invariant: ${c.invariant.join(' ')} | template:\n${c.template.code}\n| traps from his history: ${(c.traps || []).map((t) => t.t + ' (' + t.input + ')').join('; ')}
Teach like this: start from the problem and one concrete example with real data; show ASCII pictures for state changes; code as short pseudocode (≤ 15 lines) plus a C++ note; define every term; be direct; end with ONE short check question for him to answer. Keep it under 250 words unless he asks for more. Plain text, no Markdown tables.`;
}
async function askCoach(cid) {
  const box = $('#ask-in-' + cid); const qtext = box.value.trim(); if (!qtext) return;
  const c = S.byId[cid]; const turns = (S.chat[cid] ||= []);
  turns.push({ role: 'user', content: qtext }); box.value = '';
  drawChat(cid, 'Thinking…');
  try {
    const { text } = await S.sample([{ role: 'user', content: coachRules(c) }, { role: 'assistant', content: 'Understood. Ask away.' }, ...turns],
      { cache: false, onText: ({ text }) => drawChat(cid, text) });
    turns.push({ role: 'assistant', content: text }); drawChat(cid);
    await logAttempt({ kind: 'coach', card: cid, secs: 60 });
  } catch (e) { turns.pop(); drawChat(cid, e?.code === 'not_granted' ? 'Claude was not allowed for this page.' : 'Could not reach Claude (' + (e?.code || 'error') + ').'); }
}
function drawChat(cid, pending) {
  const el = $('#chat-' + cid); if (!el) return;
  el.innerHTML = (S.chat[cid] || []).map((t) => `<div class="fb" style="${t.role === 'user' ? 'background:var(--accent-soft)' : ''}"><div style="white-space:pre-wrap">${esc(t.content)}</div></div>`).join('') + (pending ? `<div class="fb"><div style="white-space:pre-wrap">${esc(pending)}</div></div>` : '');
}

const ACT = {

  filter: (d) => { S.filter = d.f; render(); },
  step: (d) => { const c = S.byId[S.openCard]; S.step = Math.max(0, Math.min(c.trace.frames.length - 1, S.step + +d.d)); drawStep(); },
  quizCard: (d) => { const c = S.byId[d.id]; const t = today();
    let qs = c.quiz.map((q) => ({ card: c.id, q: q.id }));

  tSplit: (d) => { const t = S.timer; t.splits[d.k] = Math.round((Date.now() - t.t0) / 1000); if (d.k === 't3') t.end = Date.now(); lsSet('dojo-timer', t); render(); },

};

async function boot() {

    const r = await fetch('cards.json'); const data = await r.json();
